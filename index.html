Two elements in one body. Nobody has seen that for three hundred years.`},{t:"scene",who:"Old Wren",text:"Twin-bound. I hoped I'd live to see it and dreaded it in the same measure. Listen, {name}: the colour is draining out of the world. The hedges are grey at the tips. The Fading has started again, and the last time it came, only a twin-bound stopped it."},{t:"scene",who:"Old Wren",text:"Something is crawling out of the hedgerows tonight. Show me what {el1} and {el2} can do."},{t:"battle",mon:"thornrat",lv:1},{t:"scene",who:"Old Wren",text:"Clumsy. Brave. Good. Here, take this. I found it in the roots of the old oak, warm as a hearthstone. Creatures hatch for people they trust. Keep it close and it will hatch while you fight."},{t:"reward",egg:"any",items:[["potion_small",2],["berry",3]],gold:50,text:"Wren gives you a strange egg, two Tonics and a handful of Sweetberries."},{t:"battle",mon:"mudslime",lv:2},{t:"scene",text:"The deeper you go down Hedgerow Lane, the greyer it gets. Flowers crumble like ash when you brush them. Something with thorns and a voice like grinding stone is singing further in."},{t:"battle",mon:"sporeling",lv:2},{t:"battle",mon:"thornrat",lv:3},{t:"scene",who:"Old Wren",text:"That song. A Briar Troll. They sleep for centuries unless something wakes them, and something has. When it raises its fists, brace yourself. Don't trade blows with a troll's wind-up."},{t:"boss",mon:"briartroll",lv:4},{t:"scene",text:`The troll crumbles into a heap of grey bramble. Inside its chest, where a heart should be, is a cold black stone stamped with a cracked crown.

Wren turns it over in her hands and goes quiet for a long time.`},{t:"scene",who:"Old Wren",text:"The Hollow Sovereign's mark. So he's back. He eats elements, {name}. Fire, water, light, all of it, until there's nothing left but grey. And a twin-bound is the richest meal there is. We go to Old Town at dawn. Captain Hale will know what's moving."},{t:"reward",gold:120,items:[["potion_small",2]],text:"You find 120 gold in the troll's bramble nest."}]},{title:"Bells of Old Town",place:"Old Town",color:"#B48CFF",monsters:["duskbat","lampwisp","cogling"],levels:[5,8],steps:[{t:"scene",text:"Old Town's clocktower stopped at midnight three days ago, and the streets have been dark since. The lamps still burn, but the light comes out grey."},{t:"scene",who:"Captain Hale",text:"Wren's apprentice? Twin-bound? Gods help us, the old woman wasn't lying. Fine. My watch can't hold the east streets. Bats out of the belfry, and the lamps have started walking about on their own."},{t:"battle",mon:"duskbat",lv:5},{t:"battle",mon:"lampwisp",lv:5},{t:"scene",who:"Captain Hale",text:"Not bad. The clockmaker's workshop is crawling with those brass things, coglings. They wind themselves up and they don't stop. Clear them and we can get into the tower."},{t:"battle",mon:"cogling",lv:6},{t:"reward",gold:150,items:[["potion_big",1]],text:"The clockmaker presses an Elixir and 150 gold into your hands. 'For the tower. You'll need it.'"},{t:"battle",mon:"duskbat",lv:7},{t:"scene",text:`You climb the tower in the dark. At the top, wrapped around the great bell, is a gargoyle that was never carved by any mason. Its eyes open. Stone grinds on stone.

In its chest, a black stone with a cracked crown.`},{t:"battle",mon:"lampwisp",lv:8},{t:"scene",who:"Captain Hale",text:"Watch its eyes. Anyone that thing stares at goes stiff as a statue. And when it rears back, get your guard up."},{t:"boss",mon:"gargoyle",lv:9},{t:"scene",text:`The gargoyle shatters and the bells ring for the first time in days. Colour floods back into the streets in a wave. People come out of their houses crying.

From the top of the tower you see the river glinting to the south, and a dark shape coiled in it, as long as a street.`},{t:"scene",who:"Old Wren",text:"The black stones are anchors. He's pinning the Fading in place, one beast at a time. Every one we break buys the world a little colour back. The next is in Whisper River. Nobody has crossed it in a week."},{t:"reward",gold:250,text:"The town council rewards you with 250 gold."}]},{title:"Whisper River",place:"Whisper River",color:"#4FC3F7",monsters:["crabble","bogfrog","frostnewt"],levels:[10,13],steps:[{t:"scene",text:"Whisper River is named for the sound it makes. Today it makes none. The water lies flat and grey and ice creeps along the banks in high summer."},{t:"scene",who:"Pip",text:"You're the twin-bound? You're shorter than I thought. I'm Pip, the ferryman's kid. Da went out to check the nets four days ago and the boat came back without him. I know every reed in this marsh. I'm coming."},{t:"battle",mon:"crabble",lv:10},{t:"battle",mon:"bogfrog",lv:10},{t:"scene",who:"Pip",text:"Newts don't breathe frost. That's not right. Nothing's right. The ice is coming from the deep pool by the old mill. That's where Da's nets were."},{t:"battle",mon:"frostnewt",lv:11},{t:"battle",mon:"crabble",lv:12},{t:"reward",gold:200,items:[["potion_big",1],["cake",1]],text:"Pip finds a waterproof satchel snagged in the reeds: 200 gold, an Elixir and a Honey Cake. 'Da's emergency stash. He'd want you to have it.'"},{t:"battle",mon:"frostnewt",lv:13},{t:"scene",text:`The deep pool turns slowly, a whirlpool with no wind to drive it. Something enormous rises from the centre: an eel as thick as a tree, gills flaring, spots glowing a sickly yellow.

Tangled around its fins: a ferryman's net, and a man inside it, still breathing.`},{t:"scene",who:"Pip",text:"DA! {name}, get him out of there!"},{t:"boss",mon:"riverserpent",lv:14},{t:"scene",text:`The eel sinks and the whirlpool stops. Pip drags his father onto the bank, half-frozen but alive. The river starts to whisper again.

The black stone surfaces on its own and floats to your feet. This one has words scratched into it: THE KING OF THE HILL SENDS HIS REGARDS.`},{t:"scene",who:"Old Wren",text:"The Hill King. A tyrant who hasn't walked a step in forty years. He must have struck a bargain with the Sovereign: the hills for his loyalty. He'll know we're coming. Good. Let him be afraid."},{t:"reward",gold:350,text:"Pip's father insists you take his savings: 350 gold."}]},{title:"The Ash Hills",place:"Ash Hills",color:"#FF8A3D",monsters:["cinderhound","ashwraith","emberimp"],levels:[15,18],steps:[{t:"scene",text:"The Ash Hills used to be green. Now they smoulder. Every village on the road is empty, the people taken up the hill to dig for the king."},{t:"battle",mon:"cinderhound",lv:15},{t:"battle",mon:"emberimp",lv:15},{t:"scene",who:"Captain Hale",text:"Thought you might need a sword at your back. Half my watch volunteered. We'll free the diggers. You go for the king. Don't argue, twin-bound, I outrank you."},{t:"battle",mon:"ashwraith",lv:16},{t:"battle",mon:"cinderhound",lv:17},{t:"reward",gold:300,items:[["potion_big",2]],text:"The freed diggers share what they hid from the king: 300 gold and two Elixirs."},{t:"battle",mon:"emberimp",lv:18},{t:"scene",who:"The Hill King",text:"So THIS is the twin-bound? A child with two little sparks. The Sovereign promised me your elements, {name}. {el1} for my left hand, {el2} for my right. Kneel and I'll make it quick."},{t:"scene",text:"He doesn't stand. He doesn't need to. His throne is carried by four ash-wraiths, and the club across his knees is burning."},{t:"boss",mon:"hillking",lv:19},{t:"scene",text:`The Hill King's crown rolls down the slope and stops at your feet. He's still breathing, and for the first time in forty years he's on his own two feet, running.

At the top of the hill, where his throne stood, there is a rift in the air. Grey light pours out of it. You can hear something breathing on the other side.`},{t:"scene",who:"Old Wren",text:"The Hollow Spire. His seat. Every black stone pointed here. {name}, I fought beside the last twin-bound when I was younger than you. She didn't come back. I'm going to ask you to go anyway."},{t:"reward",gold:500,items:[["cake",1]],text:"The Hill King's treasury: 500 gold."}]},{title:"The Hollow Spire",place:"The Hollow Spire",color:"#9B8BC9",monsters:["voidling","shardgolem","mirrorknight"],levels:[20,23],steps:[{t:"scene",text:"Inside the rift there is no colour at all. The Spire rises out of a grey sea, built from the stolen elements of a thousand years, crystallised and dead."},{t:"battle",mon:"voidling",lv:20},{t:"battle",mon:"shardgolem",lv:20},{t:"scene",text:`In the crystal walls you see faces. People. Creatures. All the bound who were eaten. One of them is a young woman with two lights in her chest, frozen mid-stride.

The last twin-bound.`},{t:"battle",mon:"mirrorknight",lv:21},{t:"battle",mon:"voidling",lv:22},{t:"reward",gold:400,items:[["potion_big",2]],text:"Among the crystal you find old supplies: 400 gold and two Elixirs."},{t:"battle",mon:"mirrorknight",lv:23},{t:"scene",who:"The Hollow Sovereign",text:"Three hundred years I waited for another one of you. Do you know what she tasted like? Like sunrise. Like the first rain. You'll taste better: {el1} and {el2}, together. Come. Let me unmake you."},{t:"scene",text:"{el1} and {el2} rise in you together, braided into one light. For the first time, you understand what they were always meant to become: {fusion}."},{t:"boss",mon:"hollowsovereign",lv:25},{t:"scene",text:`The Sovereign comes apart like ash in the wind. The Spire cracks from top to bottom and every stolen element pours out of it, a river of colour flooding back into the world.
